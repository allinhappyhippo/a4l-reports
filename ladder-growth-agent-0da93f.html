<html lang="zh-CN">
<head>

<title>Ladder Growth Agent</title>

<style>
html,body{margin:0;height:100%;background:#0b0f0d;overflow:hidden;cursor:default;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;background:#eef2ee;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
#board{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#board.cam{transition:transform .85s cubic-bezier(.65,0,.35,1)}
#hud{position:fixed;right:18px;bottom:14px;font:600 12px/1 system-ui,-apple-system,sans-serif;color:#8fa398;letter-spacing:.06em;opacity:0;transition:opacity .4s;pointer-events:none}
body.hud #hud,body.idle-off #hud{opacity:.85}
#dots{display:flex;gap:5px;margin-top:8px;justify-content:flex-end}
#dots i{width:6px;height:6px;border-radius:50%;background:#3b4a42}
#dots i.on{background:#d0de27}
#notes{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(1100px,92vw);box-sizing:border-box;background:rgba(10,15,12,.94);color:#eef3ee;font:500 19px/1.6 'PingFang SC','Noto Sans SC',system-ui,sans-serif;padding:16px 22px;border-radius:12px;border:1px solid rgba(208,222,39,.35);display:none}
#notes b{color:#d0de27;font-weight:800;margin-right:10px;font-family:system-ui,sans-serif}
body.notes #notes{display:block}
#black{position:fixed;inset:0;background:#000;display:none;z-index:9}
body.black #black{display:block}
#help{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,15,12,.96);color:#eef3ee;font:500 16px/1.9 system-ui,-apple-system,'PingFang SC',sans-serif;padding:26px 34px;border-radius:14px;border:1px solid rgba(208,222,39,.4);z-index:10;display:none;min-width:420px}
#help h3{margin:0 0 8px;font-size:18px;color:#d0de27}
#help kbd{display:inline-block;min-width:22px;text-align:center;padding:0 7px;margin-right:10px;border-radius:5px;background:#24302a;color:#fff;font:700 13px/24px system-ui}
body.help #help{display:block}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,10,.72);z-index:11;cursor:pointer}
#start div{color:#eef3ee;font:600 20px/1.7 system-ui,-apple-system,'PingFang SC',sans-serif;text-align:center}
#start em{display:block;font-style:normal;color:#d0de27;font-size:15px;margin-top:6px}
.foot-src{visibility:hidden}
body.src .foot-src{visibility:visible!important}
</style>
</head>

<div id="start"><div>点一下开始<em>F 全屏 · → 下一张 · ? 看快捷键</em></div></div>

  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home') load(0); else if (k === 'End') load(BOARDS.length - 1);
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'b' || k === 'B' || k === '.') tog('black');
  else if (k === 's' || k === 'S') tog('src');
  
  else if (k === 'h' || k === 'H') tog('hud');
  else if (k === '?' || k === '/') tog('help');
  else if (/^[1-9]$/.test(k)) load(+k - 1);
});
document.getElementById('viewport').addEventListener('click', () => { if (started) next(); });
document.getElementById('start').addEventListener('click', e => { e.stopPropagation(); start(); });
hud();
</script>
